<!-- Sign-up confirmation (supabase/config.toml). Colours are the light-theme values of --surface, --surface-raised, --ink, --ink-muted and --brand in design/tokens.css (email can't read CSS variables). -->
<div style="background:#FAF7F2;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#17112F">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:12px;padding:32px 24px">
    <p style="margin:0 0 24px;font-size:20px;font-weight:700;color:#3E2BB0">Tikka</p>
    <h1 style="margin:0 0 12px;font-size:22px">Confirm your email</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#5E5873">Tap the button to confirm your email and open your Tikka dashboard.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app/welcome"
       style="display:inline-block;background:#3E2BB0;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:16px;padding:14px 24px;border-radius:999px">Confirm my email</a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#5E5873">If you didn't create a Tikka account, you can ignore this email.</p>
  </div>
</div>
