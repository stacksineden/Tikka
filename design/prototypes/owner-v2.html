<style>
/* Layout: one phone-width column (full width on a phone, a framed 400px column on a computer); sticky top bar, scrolling body, sticky action bar. Tokens from design/tokens.css. */
:root {

  --success: #0E7A5A; --success-soft: #DDF4EA; --danger: #B42318; --danger-soft: #FDE7E4;
  --backdrop: rgba(23,17,47,0.45);
  --shadow-raised: 0 1px 2px rgba(23,17,47,0.06), 0 4px 12px rgba(23,17,47,0.06);
  --font-sans: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Space Mono", ui-monospace, Menlo, monospace;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface: #120E26; --surface-raised: #1C1738; --surface-sunken: #0C091C;
  --line: #2E2852; --line-strong: #7A7299; --ink: #F4F1FF; --ink-muted: #ADA6CC;
  --brand: #A797FF; --brand-soft: #2A2360; --on-brand: #120E26;
  --gold: #F4B63F; --on-gold: #17112F; --gold-text: #F4B63F; --gold-soft: #3B2B0C;
  --success: #47C7B8; --success-soft: #0F3633; --danger: #FF8A7A; --danger-soft: #4A1712;
  --backdrop: rgba(0,0,0,0.6);
  --shadow-raised: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --surface: #120E26; --surface-raised: #1C1738; --surface-sunken: #0C091C;
  --line: #2E2852; --line-strong: #7A7299; --ink: #F4F1FF; --ink-muted: #ADA6CC;
  --brand: #A797FF; --brand-soft: #2A2360; --on-brand: #120E26;
  --gold: #F4B63F; --on-gold: #17112F; --gold-text: #F4B63F; --gold-soft: #3B2B0C;

  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.phone { max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--surface); display: flex; flex-direction: column; position: relative; }
@media (min-width: 640px) { body { padding-block: 24px; } .phone { min-height: calc(100vh - 48px); border-radius: 28px; border: 1px solid var(--line); overflow: hidden; } }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); padding-block: 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.iconbtn { min-width: 44px; height: 44px; border-radius: var(--r-pill); border: 0; background: transparent; display: grid; place-items: center; }
.iconbtn:active { background: var(--surface-sunken); }
.progress { flex: 1; height: 6px; border-radius: var(--r-pill); background: var(--surface-sunken); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand); border-radius: inherit; transition: width 300ms ease; }
.linkbtn { border: 0; background: transparent; color: var(--brand); font-weight: 600; font-size: 13px; min-height: 44px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; }

main { flex: 1; padding-block: 20px 24px; display: grid; gap: 20px; align-content: start; }
h1 { font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h2 { font-size: 20px; line-height: 26px; font-weight: 700; margin: 0; }
.lead { color: var(--ink-muted); margin: 6px 0 0; font-size: 17px; line-height: 25px; }
.muted { color: var(--ink-muted); }
.small { font-size: 13px; line-height: 18px; }
.label { font-size: 13px; line-height: 18px; font-weight: 600; display: block; margin-bottom: 6px; }

.actionbar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.btn { width: 100%; min-height: 52px; border-radius: var(--r-pill); border: 0; font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; }
.btn-primary { background: var(--brand); color: var(--on-brand); }

.btn-ghost { background: var(--surface-raised); border: 1px solid var(--line); color: var(--ink); }
.btn-sm { min-height: 44px; font-size: 15px; width: auto; }

.field { display: grid; gap: 0; }
.input, select.input, textarea.input { width: 100%; min-height: 52px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface-raised); padding: 12px 14px; font-size: 17px; }
textarea.input { min-height: 80px; resize: vertical; line-height: 24px; }
.input:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
.prefix { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface-raised); min-height: 52px; padding-left: 14px; }
.prefix span { color: var(--ink-muted); font-size: 17px; }
.prefix input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; min-height: 50px; padding: 0 14px 0 4px; font-size: 17px; }
.prefix:focus-within { outline: 2px solid var(--brand); border-color: var(--brand); }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border: 2px solid var(--line); background: var(--surface-raised); border-radius: var(--r-card); min-height: 104px; display: grid; place-items: center; align-content: center; gap: 8px; padding: 10px 4px; text-align: center; font-weight: 600; font-size: 14px; line-height: 18px; position: relative; }
.tile .ic { width: 44px; height: 44px; border-radius: var(--r-pill); background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
.tile[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.tile[aria-pressed="true"] .ic { background: var(--brand); color: var(--on-brand); }
.tile .tick { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: var(--r-pill); background: var(--brand); color: var(--on-brand); display: none; place-items: center; }
.tile[aria-pressed="true"] .tick { display: grid; }

.choices { display: grid; gap: 10px; }
.choice { display: flex; align-items: center; gap: 14px; text-align: left; border: 2px solid var(--line); background: var(--surface-raised); border-radius: var(--r-card); padding: 14px 16px; min-height: 72px; width: 100%; }
.choice .ic { width: 44px; height: 44px; flex-shrink: 0; border-radius: var(--r-pill); background: var(--surface-sunken); display: grid; place-items: center; color: var(--ink-muted); }
.choice b { display: block; font-size: 17px; }
.choice[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.choice[aria-pressed="true"] .ic { background: var(--brand); color: var(--on-brand); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: var(--surface-raised); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.chip .sub { font-weight: 400; font-size: 12px; opacity: 0.8; }

.card { background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--r-card); }
.svc { padding: 14px 16px; display: grid; gap: 10px; }
.svc.off { opacity: 0.55; }
.svc-head { display: flex; align-items: center; gap: 12px; }
.check { width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; border: 2px solid var(--line-strong); background: var(--surface-raised); display: grid; place-items: center; color: transparent; padding: 0; }
.check[aria-checked="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.svc-name { flex: 1; min-width: 0; font-weight: 600; font-size: 16px; }
.svc-name small { display: block; font-weight: 400; color: var(--ink-muted); font-size: 13px; }
.price { width: 120px; flex-shrink: 0; }
.price .prefix { min-height: 44px; padding-left: 10px; }
.price .prefix input { min-height: 42px; font-size: 16px; padding-right: 8px; }
.opts { display: grid; gap: 8px; padding-left: 40px; }
.opt { display: flex; align-items: center; gap: 10px; }
.opt span { flex: 1; min-width: 0; font-size: 14px; }
.opt span small { color: var(--ink-muted); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-pill); background: var(--gold-soft); color: var(--gold-text); }
.tag.ok { background: var(--success-soft); color: var(--success); }
.tag.due { background: var(--surface-sunken); color: var(--ink); }
.tag.bad { background: var(--danger-soft); color: var(--danger); }
.tag.info { background: var(--brand-soft); color: var(--brand); }

.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ph { aspect-ratio: 1; max-width: 100%; border-radius: var(--r-md); background: var(--surface-sunken); overflow: hidden; position: relative; display: grid; place-items: center; color: var(--ink-muted); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph.s1 { background: linear-gradient(135deg, var(--brand-soft), var(--gold-soft)); }
.ph.s2 { background: linear-gradient(160deg, var(--gold-soft), var(--surface-sunken)); }
.ph.s3 { background: linear-gradient(200deg, var(--brand-soft), var(--surface-sunken)); }
.ph .x { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: var(--r-pill); border: 0; background: var(--surface-raised); display: grid; place-items: center; }
.addph { border: 2px dashed var(--line-strong); background: transparent; font-weight: 600; font-size: 13px; gap: 4px; align-content: center; cursor: pointer; }
.addph input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.days { display: grid; gap: 8px; }
.day { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-raised); width: 100%; text-align: left; }
.day b { width: 96px; }
.day span { flex: 1; color: var(--ink-muted); }
.day.on span { color: var(--ink); }
.switch { width: 46px; height: 28px; border-radius: var(--r-pill); background: var(--line-strong); position: relative; flex-shrink: 0; transition: background 160ms; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-raised); transition: transform 160ms; }
.on .switch, .switch.on { background: var(--brand); }
.on .switch::after, .switch.on::after { transform: translateX(18px); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.stepper { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 16px; }
.stepper button { width: 56px; height: 56px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: var(--surface-raised); font-size: 24px; display: grid; place-items: center; }
.stepper .n { font-size: 44px; font-weight: 800; min-width: 60px; text-align: center; }
.chairs { display: flex; justify-content: center; gap: 6px; color: var(--brand); flex-wrap: wrap; }

.hero-ok { text-align: center; display: grid; gap: 12px; justify-items: center; padding-top: 8px; }
.bigtick { width: 72px; height: 72px; border-radius: var(--r-pill); background: var(--success-soft); color: var(--success); display: grid; place-items: center; }
.linkbox { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface-raised); width: 100%; }
.linkbox .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }

.note { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--brand-soft); color: var(--ink); }
.note.gold { background: var(--gold-soft); }
.note.warn { background: var(--danger-soft); }
.note svg { flex-shrink: 0; color: var(--brand); }
.note.gold svg { color: var(--gold-text); }

.rule { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; }
.rule textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; font-size: 15px; line-height: 22px; padding: 0; min-height: 44px; field-sizing: content; }
.rule textarea:focus { outline: 0; }
.rule:focus-within { outline: 2px solid var(--brand); border-radius: var(--r-card); }
.list > * + * { border-top: 1px solid var(--line); }

.checklist { display: grid; gap: 2px; }
.checklist li { display: flex; align-items: center; gap: 12px; min-height: 48px; list-style: none; }
.checklist .dot { width: 28px; height: 28px; border-radius: var(--r-pill); background: var(--success); color: var(--surface-raised); display: grid; place-items: center; }
.checklist ul { padding: 0; margin: 0; }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--backdrop); }
.sheet { width: 100%; max-width: 420px; max-height: 90vh; overflow: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; animation: up 240ms cubic-bezier(0.22,1,0.36,1); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line-strong); margin: 4px auto 0; }

.pp { border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--line); background: var(--surface-raised); }

.pp-body { padding: 36px 16px 16px; display: grid; gap: 12px; }

/* Today */
.hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.summary { background: var(--brand); color: var(--on-brand); border-radius: var(--r-card); padding: 18px; display: grid; gap: 14px; }
.summary .big { font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -0.02em; }

.quick { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }

.btn-gold { background: var(--gold); color: var(--on-gold); }
.appt { padding: 14px 16px; display: grid; gap: 10px; }
.appt-top { display: flex; gap: 12px; align-items: flex-start; }
.time { font-family: var(--font-mono); font-weight: 700; font-size: 15px; width: 52px; flex-shrink: 0; padding-top: 1px; }
.appt-main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.appt-main b { font-size: 17px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.act { min-height: 44px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.act.main { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.appt.done { opacity: 0.7; }
.sect-title { display: flex; justify-content: space-between; align-items: baseline; }

.tabbar { position: sticky; bottom: 0; z-index: 6; background: var(--surface-raised); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { border: 0; background: transparent; min-height: 60px; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.tab[aria-current="page"] { color: var(--brand); }

.money-hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mstat { padding: 12px; border-radius: var(--r-md); background: var(--surface-raised); border: 1px solid var(--line); }
.mstat b { display: block; font-size: 17px; font-family: var(--font-mono); }
.mstat.kept { background: var(--success-soft); border-color: transparent; }
.mstat.kept b { color: var(--success); }
.line-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; min-height: 52px; }
.more-item { display: flex; align-items: center; gap: 14px; padding: 0 16px; min-height: 56px; width: 100%; border: 0; background: transparent; text-align: left; font-size: 16px; font-weight: 600; }
.more-item .muted { font-weight: 400; font-size: 13px; display: block; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: var(--r-pill); font-weight: 600; z-index: 40; max-width: calc(100% - 32px); text-align: center; }

.start { display: grid; gap: 16px; }
.start .choice { min-height: 96px; }
.waprev { background: var(--surface-sunken); border-radius: var(--r-md); padding: 14px; white-space: pre-wrap; font-size: 15px; }
</style>

const scale = () => PLACES[S.st].scale;

function seedServices() {
  const key = S.trades.join(",") + "|" + S.st;
  if (S.seededFor === key) return;
  S.seededFor = key;
  const k = scale();
  S.services = [];
  S.extras = [];
  S.trades.forEach((t) => {
    SERVICES[t].forEach((s, i) => S.services.push({
      trade: t, name: s.name, event: !!s.event, on: i < 3, open: false,
      price: s.price ? r500(s.price * k) : null, mins: s.mins || null,
      opts: s.opts ? s.opts.map(([label, p, m]) => ({ label, price: r500(p * k), mins: m })) : null,
    }));
    EXTRAS[t].forEach(([name, p]) => S.extras.push({ name, price: r500(p * k), on: false }));
  });
  S.travelFee = TRAVEL[k] || 3000;
}
function seedRules() {
  const key = S.trades.join(",");
  if (S.rulesFor === key) return;
  S.rulesFor = key;
  const goes = S.where === "go" || S.where === "both";
  S.rules = [
    "Please come on time. If you're more than 30 minutes late, we may not be able to see you and the deposit stays with us.",
    "To move your booking, tell us at least 24 hours before.",
    "If you cancel or don't come, the deposit is not refunded.",

  if (S.depositMode === "fixed") return Math.min(price, S.depositFixed);
  return Math.max(1000, Math.ceil(price * Number(S.depositMode) / 100 / 500) * 500);
}

/* ---------- Render + events ---------- */
const app = document.getElementById("app");
function route() { return (location.hash || "").replace("#", ""); }
function render(keepScroll) {
  const y = window.scrollY;
  const r = route();
  app.innerHTML = r === "setup" ? setupView() : r === "today" ? todayView() : startView();
  paint();
  window.scrollTo(0, keepScroll ? y : 0);
}
function paint() { if (window.lucide) lucide.createIcons(); }
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
function nowTime() { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "closesheet" && e.target.closest("[data-stop]") && !e.target.closest(".iconbtn")) return;
  const a = el.dataset.act, v = el.dataset.v, i = Number(el.dataset.i), id = Number(el.dataset.id);
  const keep = () => render(true);
  switch (a) {
    case "go": location.hash = v; break;
    case "next":
      if (S.step === STEPS.length - 1) { location.hash = "today"; T.tab = "today"; break; }
      S.step++; render(); break;
    case "back": if (S.step === 0) { location.hash = ""; } else { S.step--; render(); } break;
    case "preview": sheet(`${sheetHead("Your page so far")}${pagePreview()}`); break;
    case "trade": S.trades = S.trades.includes(el.dataset.id) ? S.trades.filter((t) => t !== el.dataset.id) : [...S.trades, el.dataset.id]; keep(); break;
    case "area": S.area = v; keep(); break;
    case "where": S.where = v; keep(); break;
    case "reach": S.reach = v; keep(); break;
    case "svc": S.services[i].on = !S.services[i].on; keep(); break;
    case "svcopen": S.services[i].open = !S.services[i].open; keep(); break;
    case "extra": S.extras[i].on = !S.extras[i].on; keep(); break;
    case "samplephotos": while (S.photos.length < 6) S.photos.push({ sample: true }); keep(); break;
    case "rmphoto": S.photos.splice(i, 1); keep(); break;
    case "day": S.days[v] = !S.days[v]; keep(); break;
    case "less": S.atOnce = Math.max(1, S.atOnce - 1); keep(); break;
    case "more": S.atOnce = Math.min(8, S.atOnce + 1); keep(); break;
    case "copy": { const t = "usetikka.com/" + slug(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Link copied"), () => toast(t)); break; }
    case "idphoto": S.idPhoto = true; keep(); break;
    case "reg": S.registered = v; keep(); break;
    case "acctyes": S.acctOk = true; keep(); break;
    case "acctno": S.acct = ""; S.acctOk = false; keep(); toast("Check the bank and number, then try again."); break;
    case "dmode": S.depositMode = v; keep(); break;
    case "towards": S.towardsBill = !S.towardsBill; keep(); break;
    case "rmrule": S.rules.splice(i, 1); keep(); break;
    case "addrule": S.rules.push(""); keep(); setTimeout(() => { const ts = document.querySelectorAll("[data-rule]"); ts[ts.length - 1]?.focus(); }, 0); break;
    case "toast": toast(el.dataset.msg); break;
    case "tab": T.tab = v; closeSheet(); render(); break;
    case "arrived": T.appts.find((x) => x.id === id).state = "here"; keep(); break;
    case "paid": paidSheet(T.appts.find((x) => x.id === id)); break;
    case "paidhow": T.appts.find((x) => x.id === id).state = "paid"; closeSheet(); keep(); toast(`Saved: paid by ${v.toLowerCase()}`); break;
    case "remind": remindSheet(T.appts.find((x) => x.id === id)); break;
    case "remindowed": remindSheet(T.owed[i], true); break;
    case "sendremind": closeSheet(); toast("Your WhatsApp opens with the message."); break;
    case "apptmore": sheet(`${sheetHead("Booking")}<div class="card list">${[["message-circle", "Message on WhatsApp"], ["calendar-clock", "Move to another time"], ["user-x", "Didn't come"], ["x-circle", "Cancel booking"]].map(([ic, t]) => `<button class="more-item" data-act="toast" data-msg="${t}: in the real app.">${icon(ic, 20)}<span style="flex:1">${t}</span></button>`).join("")}</div>`); break;
    case "code": sheet(`${sheetHead("Check a code")}<p class="muted" style="margin:0">For a gift, a drop card or a booking. Type the code the customer shows you.</p><input class="input mono" placeholder="e.g. GB-48K2Q" aria-label="Code"><button class="btn btn-primary" data-act="toast" data-msg="The real app shows who it is and what they get.">Check</button>`); break;
    case "newsale": sale = null; saleSheet(); break;
    case "salesvc": sale.svc = sale.rows[i][0]; sale.price = sale.rows[i][1]; sale.paid = sale.price; sale.step = 1; saleSheet(); break;
    case "salename": sale.name = v; sale.step = 2; saleSheet(); break;
    case "salenext": sale.name = document.getElementById("f-sn").value.trim(); sale.step = 2; saleSheet(); break;
    case "salemethod": sale.paid = Number(document.getElementById("f-sp").value.replace(/\D/g, "")) || 0; sale.method = v; saleSheet(); break;
    case "savesale": {
      const paid = Number(document.getElementById("f-sp").value.replace(/\D/g, "")) || 0;
      const owes = Math.max(0, sale.price - paid);
      T.sales.push({ time: nowTime(), name: sale.name || "Walk-in", svc: sale.svc, paid, method: sale.method, owes });
      if (owes) T.owed.unshift({ name: sale.name || "Walk-in", amt: owes, when: "today" });
      closeSheet(); T.tab = "today"; keep(); toast("Sale saved"); break;
    }
    case "expense": expenseSheet(); break;
    case "expkind": document.querySelectorAll("#exp-kinds .chip").forEach((c) => c.setAttribute("aria-pressed", c === el)); break;
    case "saveexp": {
      const amt = Number(document.getElementById("f-ea").value.replace(/\D/g, "")) || 0;
      const kind = document.querySelector('#exp-kinds [aria-pressed="true"]')?.dataset.v || "Other";
      if (!amt) { toast("Type how much you spent."); break; }
      T.expenses.push({ what: kind, amt }); closeSheet(); keep(); toast("Saved"); break;
    }
    case "closesheet": closeSheet(); break;
  }
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.bind) {
    const k = el.dataset.bind;
    S[k] = el.dataset.num !== undefined ? Number(el.value.replace(/\D/g, "")) || 0 : el.value;
    if (k === "acct") { S.acct = el.value.replace(/\D/g, "").slice(0, 10); el.value = S.acct; S.acctOk = false; document.getElementById("acct-name").innerHTML = acctNameBlock(); paint(); }
    const btn = document.querySelector('[data-act="next"]');
    if (btn && STEPS[S.step].ok) btn.disabled = !STEPS[S.step].ok();
  }
  if (el.dataset.svc !== undefined) {
    const s = S.services[Number(el.dataset.svc)], n = Number(el.value.replace(/\D/g, "")) || 0;
    if (el.dataset.opt !== undefined) s.opts[Number(el.dataset.opt)].price = n; else s.price = n;
  }
  if (el.dataset.extra !== undefined) S.extras[Number(el.dataset.extra)].price = Number(el.value.replace(/\D/g, "")) || 0;
  if (el.dataset.rule !== undefined) S.rules[Number(el.dataset.rule)] = el.value;
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "f-st") { S.st = el.value; S.city = Object.keys(PLACES[S.st].cities)[0]; S.area = PLACES[S.st].cities[S.city][0]; render(true); }
  else if (el.id === "f-city") { S.area = PLACES[S.st].cities[S.city][0]; render(true); }
  else if (el.id === "f-bank") { document.getElementById("acct-name").innerHTML = acctNameBlock(); paint(); }
  else if (["f-open", "f-close", "f-df", "f-idt"].includes(el.id)) render(true);
  else if (el.id === "f-photos") {
    [...el.files].forEach((f) => S.photos.push({ url: URL.createObjectURL(f) }));
    render(true);
  }
});
window.addEventListener("hashchange", () => { closeSheet(); render(); });
render();
</script>
